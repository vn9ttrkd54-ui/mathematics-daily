<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 311" role="img" aria-labelledby="title desc">
<title id="title">Axial section of the inscribed sphere and cone</title>
<desc id="desc">Triangle with apex C, base center B, and right base endpoint A. The incircle centered at I touches the base at B and both sloping sides. AI bisects the angle at A.</desc>
<rect width="250" height="311" fill="white"/>
<g font-family="system-ui, sans-serif" font-size="16" fill="#16283c">
<path d="M122 18 L28.662 282 H215.338 Z" fill="none" stroke="#254f79" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" />
<path d="M122 18 V282" fill="none" stroke="#767e87" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="122" cy="216" r="66" fill="none" stroke="#254f79" stroke-width="2.3"/>
<path d="M122 216 L215.338 282" fill="none" stroke="#767e87" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="122" cy="18" r="4.4" stroke="#254f79" stroke-width="2" fill="#254f79"/>
<circle cx="122" cy="216" r="4.4" stroke="#254f79" stroke-width="2" fill="#254f79"/>
<circle cx="122" cy="282" r="4.4" stroke="#254f79" stroke-width="2" fill="#254f79"/>
<circle cx="215.338" cy="282" r="4.4" stroke="#254f79" stroke-width="2" fill="#254f79"/>
<text x="138" y="20" text-anchor="middle" font-size="16">C</text>
<text x="109" y="217" text-anchor="middle" font-size="16">I</text>
<text x="122" y="301" text-anchor="middle" font-size="16">B</text>
<text x="229" y="288" text-anchor="middle" font-size="16">A</text></g>
</svg>
