<title id="title">Tricuspoid</title><desc id="desc">The closed three-cusped curve x equals 2 cos 2t plus cos 4t, y equals 2 sin 2t minus sin 4t. One cusp lies on the positive x-axis and two lie to the left, symmetrically above and below the x-axis.</desc>
