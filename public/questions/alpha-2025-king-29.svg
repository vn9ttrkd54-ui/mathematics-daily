<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title">
<title id="title">Triangle with sides n−1, n and n+1. Angles θ and 2θ face the shortest and longest sides.</title>
<rect width="320" height="200" fill="white"/>
<g fill="none" stroke="#172939" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M30 155 L209 32 L272 155 Z" />
<text x="102" y="79" font-size="16" text-anchor="middle" font-family="Arial,sans-serif" fill="#162534" stroke="none">n+1</text>
<text x="261" y="93" font-size="16" text-anchor="middle" font-family="Arial,sans-serif" fill="#162534" stroke="none">n−1</text>
<text x="150" y="180" font-size="16" text-anchor="middle" font-family="Arial,sans-serif" fill="#162534" stroke="none">n</text>
<text x="71" y="145" font-size="16" text-anchor="middle" font-family="Arial,sans-serif" fill="#162534" stroke="none">θ</text>
<text x="244" y="145" font-size="16" text-anchor="middle" font-family="Arial,sans-serif" fill="#162534" stroke="none">2θ</text>
</g>
</svg>
